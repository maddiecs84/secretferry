version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - unconvert
    - bodyclose
  exclusions:
    rules:
      # Tests read files they made in a temporary directory.
      - path: _test\.go
        linters: [gosec]
        text: G304
formatters:
  enable:
    - gofmt
